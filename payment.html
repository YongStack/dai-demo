<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>支付 · TennisPro</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="nav-placeholder"></div>

  <div class="container" style="padding-top:var(--gap-xl);padding-bottom:var(--gap-4xl);max-width:600px;">
    <h1 style="font-size:var(--fs-h2);font-weight:400;margin-bottom:var(--gap-xl);text-align:center;">选择支付方式</h1>

    <div class="card" style="padding:var(--gap-xl);margin-bottom:var(--gap-lg);">
      <div style="text-align:center;margin-bottom:var(--gap-xl);">
        <div style="font-size:var(--fs-micro);color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;">待支付金额</div>
        <div style="font-family:var(--font-display);font-size:48px;font-weight:700;color:var(--accent);" id="payAmount">¥0.00</div>
        <div style="font-size:var(--fs-small);color:var(--muted);margin-top:8px;">订单号：<span id="orderNo"></span></div>
      </div>

      <!-- Payment options -->
      <div class="stack" style="gap:16px;">
        <div id="alipayOption" onclick="selectPayment('alipay')" style="padding:20px;border:2px solid var(--accent);border-radius:var(--radius-lg);cursor:pointer;display:flex;align-items:center;gap:16px;transition:all var(--ease);">
          <div style="width:48px;height:48px;border-radius:var(--radius);background:#1677FF;display:flex;align-items:center;justify-content:center;font-size:28px;">💰</div>
          <div style="flex:1;"><div style="font-size:var(--fs-h4);font-weight:600;">支付宝</div><div style="font-size:var(--fs-small);color:var(--muted);">推荐 · 安全便捷</div></div>
          <div style="width:24px;height:24px;border-radius:50%;border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;"><div style="width:12px;height:12px;background:var(--accent);border-radius:50%;"></div></div>
        </div>

        <div id="wechatOption" onclick="selectPayment('wechat')" style="padding:20px;border:2px solid var(--border);border-radius:var(--radius-lg);cursor:pointer;display:flex;align-items:center;gap:16px;transition:all var(--ease);">
          <div style="width:48px;height:48px;border-radius:var(--radius);background:#07C160;display:flex;align-items:center;justify-content:center;font-size:28px;">💬</div>
          <div style="flex:1;"><div style="font-size:var(--fs-h4);font-weight:600;">微信支付</div><div style="font-size:var(--fs-small);color:var(--muted);">扫码支付</div></div>
          <div style="width:24px;height:24px;border-radius:50%;border:2px solid var(--border-light);"></div>
        </div>
      </div>

      <!-- Countdown -->
      <div style="margin-top:var(--gap-xl);padding:16px;background:rgba(255,176,32,.1);border-radius:var(--radius);text-align:center;">
        <div style="font-size:var(--fs-small);color:var(--warning);">
          ⏰ 支付剩余时间：<span id="countdown" style="font-weight:700;font-family:var(--font-mono);font-size:var(--fs-h4);">29:59</span>
        </div>
        <div style="font-size:var(--fs-micro);color:var(--muted-2);margin-top:4px;">30分钟内未支付将自动取消订单</div>
      </div>
    </div>

    <button class="btn btn-accent btn-lg" style="width:100%;" onclick="payNow()">确认支付 →</button>

    <!-- Payment failure state (hidden) -->
    <div class="card hidden" id="payFailCard" style="padding:var(--gap-xl);margin-top:var(--gap-lg);border-color:var(--danger);">
      <div style="text-align:center;">
        <div style="font-size:48px;margin-bottom:16px;">❌</div>
        <h3 style="font-size:var(--fs-h3);font-weight:600;color:var(--danger);margin-bottom:8px;">支付失败</h3>
        <p style="color:var(--muted);font-size:var(--fs-small);margin-bottom:var(--gap-lg);">网络异常导致支付未完成，请重新支付</p>
        <button class="btn btn-accent" onclick="retryPay()">重新支付</button>
      </div>
    </div>
  </div>

  <div id="footer-placeholder"></div>
  <script src="js/app.js"></script>
  <script>
    var selectedPayment = 'alipay';
    var countdownTimer = null;
    var secondsLeft = 29 * 60 + 59;
    var currentOrderNo = '';

    document.addEventListener('DOMContentLoaded', function() {
      var orderData = JSON.parse(sessionStorage.getItem('tennispro_order') || '{}');
      if (orderData.total) {
        document.getElementById('payAmount').textContent = '¥' + orderData.total.toFixed(2);
        document.getElementById('orderNo').textContent = orderData.orderNo || '';
        currentOrderNo = orderData.orderNo || '';
      } else {
        // Demo data if no order
        document.getElementById('payAmount').textContent = '¥329.00';
        currentOrderNo = 'TP' + Date.now().toString().slice(-10);
        document.getElementById('orderNo').textContent = currentOrderNo;
      }
      startCountdown();
    });

    function selectPayment(method) {
      selectedPayment = method;
      var alipay = document.getElementById('alipayOption');
      var wechat = document.getElementById('wechatOption');
      if (method === 'alipay') {
        alipay.style.borderColor = 'var(--accent)';
        alipay.querySelector('div:last-child').style.borderColor = 'var(--accent)';
        alipay.querySelector('div:last-child').innerHTML = '<div style="width:12px;height:12px;background:var(--accent);border-radius:50%;"></div>';
        wechat.style.borderColor = 'var(--border)';
        wechat.querySelector('div:last-child').style.borderColor = 'var(--border-light)';
        wechat.querySelector('div:last-child').innerHTML = '';
      } else {
        wechat.style.borderColor = 'var(--accent)';
        wechat.querySelector('div:last-child').style.borderColor = 'var(--accent)';
        wechat.querySelector('div:last-child').innerHTML = '<div style="width:12px;height:12px;background:var(--accent);border-radius:50%;"></div>';
        alipay.style.borderColor = 'var(--border)';
        alipay.querySelector('div:last-child').style.borderColor = 'var(--border-light)';
        alipay.querySelector('div:last-child').innerHTML = '';
      }
    }

    function startCountdown() {
      countdownTimer = setInterval(function() {
        secondsLeft--;
        if (secondsLeft <= 0) {
          clearInterval(countdownTimer);
          document.getElementById('countdown').textContent = '00:00';
          // Auto-cancel order
          if (currentOrderNo) {
            var orders = TennisPro.getOrders();
            var order = orders.find(function(o){return o.id===currentOrderNo;});
            if (order) {
              order.status = 'cancelled';
              TennisPro.saveOrders(orders);
            }
          }
          alert('订单支付超时，请重新下单');
          window.location.href = 'orders.html';
          return;
        }
        var m = Math.floor(secondsLeft / 60);
        var s = secondsLeft % 60;
        document.getElementById('countdown').textContent = 
          (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
      }, 1000);
    }

    function payNow() {
      // Simulate payment processing
      TennisPro.showToast('支付处理中...');
      // Simulate payment success after delay
      setTimeout(function() {
        // Update order status to "shipping" (待发货)
        if (currentOrderNo) {
          var orders = TennisPro.getOrders();
          var order = orders.find(function(o){return o.id===currentOrderNo;});
          if (order) {
            // Idempotency check: only update if still pending
            if (order.status === 'pending') {
              order.status = 'shipping';
              order.payMethod = selectedPayment === 'alipay' ? '支付宝' : '微信支付';
              TennisPro.saveOrders(orders);
            }
          }
        }
        window.location.href = 'payment-success.html';
      }, 1500);
    }

    function retryPay() {
      document.getElementById('payFailCard').classList.add('hidden');
    }
  </script>
</body>
</html>
