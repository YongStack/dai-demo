<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>登录/注册 · TennisPro</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="nav-placeholder"></div>

  <div class="container" style="padding-top:var(--gap-3xl);padding-bottom:var(--gap-4xl);max-width:480px;">
    <div class="card" style="padding:var(--gap-2xl);">
      <div style="text-align:center;margin-bottom:var(--gap-xl);">
        <a href="index.html" class="nav-logo" style="display:inline-block;font-size:32px;">Tennis<span>Pro</span></a>
        <h1 style="font-size:var(--fs-h3);font-weight:500;margin-top:var(--gap-md);">登录 / 注册</h1>
        <p style="font-size:var(--fs-small);color:var(--muted);margin-top:8px;">手机号验证码登录，未注册将自动注册</p>
      </div>

      <form id="loginForm" onsubmit="return doLogin(event)">
        <div class="form-group">
          <label class="form-label">手机号</label>
          <div class="row" style="gap:0;">
            <span style="padding:12px 16px;background:var(--surface-2);border:1px solid var(--border);border-right:none;border-radius:var(--radius) 0 0 var(--radius);color:var(--muted);font-size:var(--fs-body);">+86</span>
            <input class="form-input" id="phoneInput" style="border-radius:0 var(--radius) var(--radius) 0;" placeholder="请输入手机号" maxlength="11" />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">短信验证码</label>
          <div class="row" style="gap:12px;">
            <input class="form-input" id="codeInput" placeholder="请输入验证码" maxlength="6" style="flex:1;" />
            <button type="button" class="btn btn-outline btn-sm" id="sendCodeBtn" onclick="sendCode()" style="white-space:nowrap;min-width:120px;justify-content:center;">获取验证码</button>
          </div>
        </div>

        <button type="submit" class="btn btn-accent btn-lg" style="width:100%;margin-top:var(--gap-md);">登录 / 注册</button>
      </form>

      <div style="margin-top:var(--gap-xl);padding-top:var(--gap-lg);border-top:1px solid var(--border);text-align:center;">
        <p style="font-size:var(--fs-micro);color:var(--muted-2);">
          登录即代表同意 <a href="#" style="color:var(--accent);">《用户协议》</a> 和 <a href="#" style="color:var(--accent);">《隐私政策》</a>
        </p>
        <p style="font-size:var(--fs-micro);color:var(--muted-2);margin-top:8px;">
          <a href="admin-login.html" style="color:var(--muted);">管理员入口 →</a>
        </p>
      </div>
    </div>
  </div>

  <div id="footer-placeholder"></div>
  <script src="js/app.js"></script>
  <script>
    var codeCountdown = 0;
    function sendCode() {
      var phone = document.getElementById('phoneInput').value;
      if (!phone || phone.length !== 11) {
        TennisPro.showToast('请输入正确的手机号');
        return;
      }
      TennisPro.showToast('验证码已发送');
      codeCountdown = 60;
      var btn = document.getElementById('sendCodeBtn');
      btn.disabled = true;
      var timer = setInterval(function() {
        codeCountdown--;
        btn.textContent = codeCountdown + 's 后重发';
        if (codeCountdown <= 0) {
          clearInterval(timer);
          btn.disabled = false;
          btn.textContent = '获取验证码';
        }
      }, 1000);
    }

    function doLogin(e) {
      e.preventDefault();
      var phone = document.getElementById('phoneInput').value;
      var code = document.getElementById('codeInput').value;
      if (!phone || phone.length !== 11) { TennisPro.showToast('请输入正确的手机号'); return false; }
      if (!code || code.length !== 6) { TennisPro.showToast('请输入6位验证码'); return false; }
      TennisPro.showToast('登录成功');
      // Save user to localStorage
      TennisPro.saveUser({phone:phone, name:'用户' + phone.slice(-4)});
      setTimeout(function() {
        var returnUrl = new URLSearchParams(window.location.search).get('returnUrl') || 'account.html';
        window.location.href = returnUrl;
      }, 800);
      return false;
    }
  </script>
</body>
</html>
