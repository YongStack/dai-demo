<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>全部商品 · TennisPro</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="nav-placeholder" data-active="products"></div>

  <div class="container" style="padding-top:var(--gap-xl);">
    <div class="row-between" style="margin-bottom:var(--gap-xl);">
      <div>
        <h1 style="font-size:var(--fs-h2);font-weight:400;" id="pageTitle">全部商品</h1>
        <p style="color:var(--muted);font-size:var(--fs-small);margin-top:8px;" id="pageSubtitle">共 14 件商品</p>
      </div>
      <div class="row" style="gap:12px;">
        <select class="form-input" style="width:auto;padding:8px 16px;" id="sortSelect">
          <option value="default">默认排序</option>
          <option value="sales">按销量</option>
          <option value="price-asc">价格从低到高</option>
          <option value="price-desc">价格从高到低</option>
        </select>
      </div>
    </div>

    <!-- Category filters -->
    <div class="row" style="flex-wrap:wrap;gap:12px;margin-bottom:var(--gap-xl);" id="catFilters"></div>

    <!-- Products grid -->
    <div class="grid grid-4" id="productsGrid"></div>

    <!-- Empty state -->
    <div class="empty-state hidden" id="emptyState">
      <div class="empty-icon">🎾</div>
      <div class="empty-title">没有找到相关商品</div>
      <div class="empty-desc">看看这些热门推荐吧</div>
      <a href="products.html" class="btn btn-accent">浏览全部商品</a>
    </div>

    <!-- Pagination -->
    <div class="row" style="justify-content:center;gap:8px;margin-top:var(--gap-2xl);" id="pagination"></div>
  </div>

  <div id="footer-placeholder"></div>
  <script src="js/app.js"></script>
  <script>
    var params = new URLSearchParams(window.location.search);
    var currentCat = params.get('cat') || '';
    var currentSort = params.get('sort') || 'default';
    var pageSize = 8;
    var currentPage = 1;

    function getFilteredProducts() {
      var list = TennisPro.PRODUCTS.slice();
      if (currentCat) list = list.filter(function(p){return p.cat===currentCat;});
      if (currentSort === 'sales') list.sort(function(a,b){return b.sales-a.sales;});
      else if (currentSort === 'price-asc') list.sort(function(a,b){return a.price-b.price;});
      else if (currentSort === 'price-desc') list.sort(function(a,b){return b.price-a.price;});
      return list;
    }

    function createProductCard(p) {
      var cat = TennisPro.CATEGORIES.find(function(c){return c.id===p.cat;});
      var div = document.createElement('a');
      div.href = 'product-detail.html?id=' + p.id;
      div.className = 'product-card';
      div.innerHTML =
        '<div class="product-card-img">' +
          (p.tag ? '<span class="product-tag">' + p.tag + '</span>' : '') +
          '<span class="ph">' + (cat ? cat.icon : '🎾') + '</span>' +
        '</div>' +
        '<div class="product-card-body">' +
          '<div class="product-card-name">' + p.name + '</div>' +
          '<div class="product-card-price">¥' + p.price + '</div>' +
          (p.originalPrice ? '<div style="font-size:var(--fs-micro);color:var(--muted-2);text-decoration:line-through;">¥' + p.originalPrice + '</div>' : '') +
          '<div class="product-card-sales">已售 ' + p.sales + (p.stock===0 ? ' · 缺货' : '') + '</div>' +
        '</div>';
      return div;
    }

    function render() {
      var all = getFilteredProducts();
      var grid = document.getElementById('productsGrid');
      var empty = document.getElementById('emptyState');
      grid.innerHTML = '';
      if (all.length === 0) {
        empty.classList.remove('hidden');
        document.getElementById('pagination').innerHTML = '';
        return;
      }
      empty.classList.add('hidden');
      var totalPages = Math.ceil(all.length / pageSize);
      if (currentPage > totalPages) currentPage = 1;
      var start = (currentPage - 1) * pageSize;
      var pageItems = all.slice(start, start + pageSize);
      pageItems.forEach(function(p){ grid.appendChild(createProductCard(p)); });

      // Pagination
      var pgEl = document.getElementById('pagination');
      pgEl.innerHTML = '';
      for (var i = 1; i <= totalPages; i++) {
        (function(pg) {
          var btn = document.createElement('button');
          btn.className = 'cat-pill' + (pg === currentPage ? ' active' : '');
          btn.textContent = pg;
          btn.onclick = function() { currentPage = pg; render(); window.scrollTo(0,0); };
          pgEl.appendChild(btn);
        })(i);
      }
      // Update title
      var catObj = TennisPro.CATEGORIES.find(function(c){return c.id===currentCat;});
      document.getElementById('pageTitle').textContent = catObj ? catObj.name : '全部商品';
      document.getElementById('pageSubtitle').textContent = '共 ' + all.length + ' 件商品';
    }

    document.addEventListener('DOMContentLoaded', function() {
      // Category filters
      var catFilters = document.getElementById('catFilters');
      var allPill = document.createElement('div');
      allPill.className = 'cat-pill' + (!currentCat ? ' active' : '');
      allPill.textContent = '全部';
      allPill.onclick = function() { currentCat = ''; currentPage = 1; render(); updatePills(); };
      catFilters.appendChild(allPill);
      TennisPro.CATEGORIES.forEach(function(cat) {
        var pill = document.createElement('div');
        pill.className = 'cat-pill' + (currentCat === cat.id ? ' active' : '');
        pill.textContent = cat.icon + ' ' + cat.name;
        pill.onclick = function() { currentCat = cat.id; currentPage = 1; render(); updatePills(); };
        catFilters.appendChild(pill);
      });
      function updatePills() {
        var pills = catFilters.querySelectorAll('.cat-pill');
        pills.forEach(function(p, i) {
          p.classList.toggle('active', i === 0 ? !currentCat : (TennisPro.CATEGORIES[i-1] && TennisPro.CATEGORIES[i-1].id === currentCat));
        });
      }

      // Sort
      var sortSelect = document.getElementById('sortSelect');
      sortSelect.value = currentSort;
      sortSelect.onchange = function() { currentSort = sortSelect.value; render(); };

      render();
    });
  </script>
</body>
</html>
